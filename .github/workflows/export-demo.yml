name: Train and export demo model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/export_demo.py"
      - ".github/workflows/export-demo.yml"

permissions:
  contents: write

concurrency:
  group: export-demo
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2.0.0" pandas scikit-learn xgboost lightgbm imbalanced-learn \
            pyyaml "pydantic>=2.0" mlflow matplotlib seaborn

      - name: Train, export and check parity
        run: python -m scripts.export_demo

      - name: Commit results
        run: |
          git config user.name "Nishant Iyer"
          git config user.email "111642900+Nishant-Iyer@users.noreply.github.com"
          git add demo/ artifacts/metadata.json artifacts/full_pipeline.joblib artifacts/autoencoder.pt \
            artifacts/pr_curve.png artifacts/confusion_matrix.png artifacts/cost_curve.png
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Retrain model and export demo files"
          git pull --rebase origin main
          git push origin HEAD:main
