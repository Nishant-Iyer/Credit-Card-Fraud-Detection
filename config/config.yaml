# Credit Card Fraud Detection Configuration

data:
  openml_id: 1597 # OpenML dataset ID for credit card fraud
  data_dir: "data"
  raw_file: "data/creditcard.csv"
  train_file: "data/train.csv"
  test_file: "data/test.csv"
  target_col: "Class"
  test_size: 0.2
  val_size: 0.2 # share of the training data held out to choose the alert threshold
  random_state: 42

features:
  cyclical_time_period: 86400 # 24 hours in seconds
  scale_cols:
    - "Amount"
  # The OpenML copy of the dataset (ID 1597) has no Time column, so the model uses V1-V28 and
  # Amount only. Time is dropped here so API requests that include it score the same way.
  drop_cols:
    - "Time"

models:
  autoencoder:
    input_dim: 29 # V1-V28 + scaled Amount (the network sizes itself from the data)
    encoding_dim: 16
    epochs: 15
    batch_size: 256
    learning_rate: 0.001
    model_path: "artifacts/autoencoder.pt"
  
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 1.0 # Will be handled by SMOTE or subclass weights
  
  lightgbm:
    n_estimators: 200
    max_depth: 6
    num_leaves: 31
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8

business_costs:
  manual_review_cost: 5.0 # Cost to manually review a transaction
  fraud_cost_factor: 1.0 # 100% of transaction amount is lost on undetected fraud

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "credit-card-fraud-detection"
  run_name: "production_stacking_ensemble"
